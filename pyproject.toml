[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supplyguard"
version = "0.1.0"
description = "Practical software supply-chain release security for small organizations"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
supplyguard = "supplyguard.cli:main"
supplyguard-gui = "supplyguard.gui:main"

[tool.setuptools.packages.find]
include = ["supplyguard*"]
